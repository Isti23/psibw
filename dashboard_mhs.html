<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD - Dashboard Mahasiswa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      body {
        background-color: #f0f2f5;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow-x: hidden;
      }

      /* ================= SIDEBAR ================= */
      .sidebar {
        width: 250px;
        min-height: 100vh;
        background-color: #659be0;
        color: white;
        position: sticky;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        z-index: 100;
      }

      .user-profile {
        padding: 40px 15px 20px;
        text-align: center;
      }

      .user-profile .avatar {
        width: 90px;
        height: 90px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #659be0;
        font-size: 45px;
        margin: 0 auto 15px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.5);
      }

      .user-profile .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .user-profile .name {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 5px;
        word-wrap: break-word;
      }

      .user-profile .role {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .nav-menu {
        margin-top: 20px;
        flex-grow: 1;
      }

      .nav-link {
        color: white;
        padding: 15px 25px;
        font-size: 15px;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: 0.2s;
        border-left: 4px solid transparent;
      }

      .nav-link i {
        width: 30px;
        font-size: 18px;
        margin-right: 10px;
        text-align: center;
      }

      .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .nav-link.active {
        background-color: #8cbcf0;
        font-weight: 600;
        border-left-color: #fff;
      }

      .btn-keluar-wrapper {
        padding: 20px;
        margin-top: auto;
      }

      .btn-keluar {
        background-color: #dce4eb;
        color: #b72b2b;
        font-weight: 800;
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        text-decoration: none;
        display: block;
        font-size: 14px;
        transition: 0.3s;
        border: none;
        width: 100%;
      }

      .btn-keluar:hover {
        background-color: #cdd8e1;
        color: #a02222;
      }

      /* ================= MAIN CONTENT ================= */
      .main-content {
        flex-grow: 1;
        padding: 30px 40px;
      }

      .header-title {
        color: #1a4971;
        font-weight: 700;
        font-size: 24px;
        margin-bottom: 25px;
      }

      /* KARTU PROFIL UTAMA */
      .profile-card {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 25px;
        border: none;
        position: relative;
      }

      .btn-edit-profile {
        position: absolute;
        top: 25px;
        right: 25px;
        background-color: #659be0;
        border: none;
        font-weight: 600;
        border-radius: 8px;
        padding: 10px 16px;
      }

      .btn-edit-profile:hover {
        background-color: #4d88d6;
      }

      .foto-placeholder {
        background-color: #e2e8f0;
        color: #64748b;
        font-weight: 600;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 12px;
        width: 120px;
        height: 140px;
        font-size: 14px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
      }

      .foto-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-info h4 {
        font-weight: 800;
        color: #000;
        margin-bottom: 12px;
        font-size: 20px;
        text-transform: uppercase;
      }

      .profile-info p {
        margin-bottom: 8px;
        color: #000;
        font-weight: 500;
        font-size: 15px;
      }

      .text-aktif {
        color: #32cd32;
        font-weight: 700;
      }

      /* KARTU IPK & SEMESTER */
      .stat-card {
        border-radius: 12px;
        color: white;
        padding: 25px;
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        margin-bottom: 20px;
        text-align: center;
        height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .stat-card .title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
        text-align: left;
      }

      .stat-card .number {
        font-size: 48px;
        font-weight: 700;
        line-height: 1;
      }

      .bg-blue-light {
        background-color: #3b82f6;
      }

      .bg-blue-dark {
        background-color: #2b4c9b;
      }

      /* KARTU TABEL MATAKULIAH */
      .table-card {
        background-color: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        border: none;
        min-height: 320px;
      }

      .table-card-header {
        background-color: #c2c06a;
        color: white;
        font-weight: 600;
        font-size: 18px;
        padding: 15px;
        text-align: center;
      }

      .table-wrapper {
        padding: 15px 25px;
      }

      .table-custom {
        width: 100%;
      }

      .table-custom th {
        color: #000;
        padding: 10px 5px;
        font-size: 15px;
        font-weight: 700;
        border-bottom: 1px solid #eee;
      }

      .table-custom td {
        padding: 12px 5px;
        font-size: 15px;
        border-bottom: 1px solid #f9f9f9;
        color: #333;
      }

      .submenu {
        display: none;
        background-color: #5b8fd1;
      }

      .submenu-link {
        display: block;
        padding: 12px 25px 12px 60px;
        color: white;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
      }

      .submenu-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <div class="sidebar">
        <div class="user-profile">
          <div class="avatar" id="sidebar-foto">
            <i class="fas fa-user"></i>
          </div>
          <div class="name" id="sidebar-nama">Memuat...</div>
          <div class="role">MAHASISWA</div>
        </div>

        <div class="nav-menu">
  
          <a href="dashboard_mhs.html" class="nav-link active">
            <i class="fas fa-house"></i>
            Dashboard
          </a>

          <a href="#" class="nav-link" onclick="toggleMenu('profilMenu')">
            <i class="fas fa-user"></i>
            Profil Mahasiswa

            <span style="margin-left: auto">
              <i class="fas fa-chevron-down"></i>
            </span>
          </a>

          <div id="profilMenu" class="submenu">
            <a href="biodata_mhs.html" class="submenu-link"> Biodata </a>

            <a href="edit_profil_mhs.html" class="submenu-link">
              Edit Profil
            </a>
          </div>


          <a href="#" class="nav-link" onclick="toggleMenu('akademikMenu')">
            <i class="fas fa-book"></i>
            Akademik

            <span style="margin-left: auto">
              <i class="fas fa-chevron-down"></i>
            </span>
          </a>

          <div id="akademikMenu" class="submenu">
            <a href="krs_mhs.html" class="submenu-link"> KRS </a>

            <a href="jadwal_mhs.html" class="submenu-link"> Jadwal Kuliah </a>

            <a href="nilai_mhs.html" class="submenu-link"> Nilai </a>
          </div>
        </div>

        <div class="btn-keluar-wrapper">
          <a href="login.html" class="btn-keluar">KELUAR</a>
        </div>
      </div>

      <div class="main-content">
        <div class="header-title">Selamat datang</div>

        <div class="profile-card">
          <div class="foto-placeholder" id="box-foto">FOTO</div>
          <div class="profile-info">
            <h4 id="profil-nama">Nama Mahasiswa</h4>
            <p>Mahasiswa <span class="text-aktif">Aktif</span></p>
            <p id="profil-angkatan">-</p>
            <a
              href="edit_profil_mhs.html"
              class="btn btn-primary btn-edit-profile"
            >
              <i class="fas fa-user-edit"></i> Edit Profil
            </a>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-4">
            <div class="stat-card bg-blue-light">
              <div class="title">IPK</div>
              <div class="number" id="angka-ipk">0.00</div>
            </div>

            <div class="stat-card bg-blue-dark">
              <div class="title">Semester</div>
              <div class="number" id="angka-semester">0</div>
            </div>
            <div class="stat-card bg-blue-light">
              <div class="title">Total SKS</div>
              <div class="number" id="angka-total-sks">0</div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="table-card">
              <div class="table-card-header">
                Daftar Matakuliah semester ini
              </div>
              <div class="table-wrapper">
                <table class="table-custom">
                  <thead>
                    <tr>
                      <th width="30%">Kode</th>
                      <th>Nama Matakuliah</th>
                    </tr>
                  </thead>
                  <tbody id="tbody-matkul-mhs">
                    <tr>
                      <td colspan="2" class="text-center text-muted py-4">
                        Memuat daftar mata kuliah...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        loadDashboardMahasiswa();
      });

      function loadDashboardMahasiswa() {
        fetch("api/get_profile_mhs.php")
          .then((response) => response.json())
          .then((result) => {
            if (result.status === "success") {
              const mhs = result.data;
              document.getElementById("sidebar-nama").innerText =
                mhs.nama_mhs || "-";
              document.getElementById("profil-nama").innerText =
                mhs.nama_mhs || "NAMA MAHASISWA";

              if (mhs.nim) {
                document.getElementById("profil-angkatan").innerText =
                  mhs.nim.substring(0, 2) === "24"
                    ? "2024"
                    : "20" + mhs.nim.substring(0, 2);
              }

              document.getElementById("angka-ipk").innerText =
                mhs.ipk || "0.00";
              document.getElementById("angka-semester").innerText =
                mhs.semester || "0";
              document.getElementById("angka-total-sks").innerText =
                mhs.total_sks || "0";

              if (mhs.foto && mhs.foto !== "default.jpg" && mhs.foto !== "") {
                const imgTag = `<img src="foto/${mhs.foto}" alt="Foto Profil">`;
                document.getElementById("box-foto").innerHTML = imgTag;
                document.getElementById("sidebar-foto").innerHTML = imgTag;
              }

              const tbody = document.getElementById("tbody-matkul-mhs");
              tbody.innerHTML = "";

              if (mhs.matakuliah && mhs.matakuliah.length > 0) {
                mhs.matakuliah.forEach((matkul) => {
                  tbody.innerHTML += `
                                <tr>
                                    <td class="fw-bold text-secondary">${matkul.kode_mk}</td>
                                    <td>${matkul.nama_mk}</td>
                                </tr>
                            `;
                });
              } else {
                tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted py-4">Belum ada mata kuliah yang dikontrak.</td></tr>`;
              }
            } else {
              document.getElementById("profil-nama").innerText =
                "Data tidak ditemukan";
              console.error("Pesan dari server:", result.message);
            }
          })
          .catch((error) => {
            console.error("FETCH ERROR:", error);

            fetch("api/get_profile_mhs.php")
              .then((res) => res.text())
              .then((data) => {
                console.log(data);

                document.getElementById("tbody-matkul-mhs").innerHTML = `
            <tr>
                <td colspan="2" class="text-danger text-center">
                    Cek console browser (F12)
                </td>
            </tr>
        `;
              });
          });
      }
      function toggleMenu(menuId) {
        const menu = document.getElementById(menuId);
        if (menu.style.display === "block") {
          menu.style.display = "none";
        } else {
          menu.style.display = "block";
        }
      }
    </script>
  </body>
</html>
