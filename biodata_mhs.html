        }

        }

            color:white;
            text-decoration:none;
            font-size:14px;
            transition:0.2s;
        }

        .submenu-link:hover{
            background-color:rgba(255,255,255,0.1);
            color:white;
        }

        .submenu-link.active{
            background-color:rgba(255,255,255,0.15);
            font-weight:600;
        }

        .btn-keluar-wrapper{
            padding:20px;
            margin-top:auto;
        }

        .btn-keluar{
            background-color:#dce4eb;
            color:#b72b2b;
            font-weight:800;
            text-align:center;
            padding:12px;
            border-radius:10px;
            text-decoration:none;
            display:block;
            font-size:14px;
            transition:0.3s;
            border:none;
            width:100%;
        }

        .btn-keluar:hover{
            background-color:#cdd8e1;
            color:#a02222;
        }

        /* ================= MAIN CONTENT ================= */

        .main-content{
            flex:1;
            padding:35px;
        }

        .title-page{
            font-size:35px;
            font-weight:800;
            color:#1e293b;
            margin-bottom:25px;
        }

        /* ================= PROFILE CARD ================= */

        .profile-modern-card{
            background:white;
            border-radius:25px;
            padding:35px;
            box-shadow:0 5px 15px rgba(0,0,0,0.04);
        }

        .foto-wrapper{
            position:relative;
            width:170px;
            margin:auto;
        }

        .foto-modern{
            width:170px;
            height:190px;
            border-radius:18px;
            object-fit:cover;
            border:4px solid #eef2ff;
        }

        .status-dot{
            width:18px;
            height:18px;
            background:#22c55e;
            border-radius:50%;
            position:absolute;
            right:-3px;
            bottom:15px;
            border:3px solid white;
        }

        .nama-modern{
            font-weight:800;
            color:#0f172a;
            margin-bottom:12px;
        }

        .info-modern{
            display:flex;
            gap:25px;
            flex-wrap:wrap;
            color:#94a3b8;
            margin-bottom:25px;
        }

        .mini-card-wrapper{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .mini-card{
            border:1px dashed #dbe2ea;
            border-radius:18px;
            padding:20px;
            min-width:130px;
            background:#fafcff;
        }

        .mini-card h3{
            font-weight:800;
            margin:0;
            color:#0f172a;
        }

        .mini-card p{
            margin:8px 0 0;
            color:#94a3b8;
        }

        /* ================= DETAIL CARD ================= */

        .detail-card{
            background:white;
            border-radius:25px;
            padding:35px;
            margin-top:30px;
            box-shadow:0 5px 15px rgba(0,0,0,0.04);
        }

        .detail-card h4{
            font-weight:800;
            margin-bottom:35px;
            color:#0f172a;
        }

        .detail-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:30px;
        }

        .detail-grid label{
            color:#94a3b8;
            margin-bottom:8px;
            display:block;
        }

        .detail-grid p{
            font-weight:700;
            color:#0f172a;
            font-size:17px;
        }

        @media(max-width:768px){

            .sidebar{
                width:100%;
                min-height:auto;
                position:relative;
            }

            .detail-grid{
                grid-template-columns:1fr;
            }

            .main-content{
                padding:20px;
            }

        }

    </style>

</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

    fetch('api/get_profile_mhs.php')

    .then(res => res.json())

    .then(result => {

        if(result.status === 'success'){

            const mhs = result.data;

            document.getElementById('sidebar-nama').innerText =
            mhs.nama_mhs || '-';

            document.getElementById('nama-mahasiswa').innerText =
            mhs.nama_mhs || '-';

            document.getElementById('nim').innerText =
            mhs.nim || '-';

            document.getElementById('prodi').innerText =
            mhs.prodi || '-';

            document.getElementById('detail-prodi').innerText =
            mhs.prodi || '-';

            document.getElementById('fakultas').innerText =
mhs.fakultas || '-';

document.getElementById('jurusan').innerText =
mhs.jurusan || '-';

            document.getElementById('dosen_pa').innerText =
mhs.nama_dosen || '-';

            document.getElementById('detail-email').innerText =
            mhs.email || '-';

            document.getElementById('ipk').innerText =
            mhs.ipk || '0.00';

            document.getElementById('semester').innerText =
            mhs.semester || '0';

            document.getElementById('total_sks').innerText =
mhs.total_sks || '0';
            document.getElementById('tempat_lahir').innerText =
            mhs.tempat_lahir || '-';

            document.getElementById('tanggal_lahir').innerText =
            mhs.tanggal_lahir || '-';

            document.getElementById('jenis_kelamin').innerText =
            mhs.jenis_kelamin || '-';

            if(mhs.nim){

                document.getElementById('angkatan').innerText =
                '20' + mhs.nim.substring(0,2);

            }

            if(mhs.foto && mhs.foto !== 'default.jpg'){

                document.getElementById('foto-profil').src =
                'foto/' + mhs.foto;

                document.getElementById('sidebar-foto').innerHTML =
                `<img src="foto/${mhs.foto}">`;

            }

        }

    })

    .catch(err => {

        console.error(err);

        alert('Gagal mengambil data mahasiswa');

    });

    function toggleMenu(menuId){

        const menu = document.getElementById(menuId);

        if(menu.style.display === 'block'){

            menu.style.display = 'none';

        }else{

            menu.style.display = 'block';

        }

    }

</script>
