<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD - Dashboard Dosen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      /* CSS Sama persis dengan template utama agar seragam */
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      .sidebar {
        width: 230px;
        min-height: 100vh;
        background-color: #5b9bd5;
        color: white;
        position: sticky;
        top: 0;
        left: 0;
      }
      .user-profile {
        padding: 30px 15px 20px;
        text-align: center;
      }
      .user-profile .avatar {
        width: 65px;
        height: 65px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #5b9bd5;
        font-size: 32px;
        margin: 0 auto 10px;
      }
      .user-profile .name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .user-profile .role {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.9;
      }
      .nav-menu {
        margin-top: 10px;
      }
      .nav-link {
        color: white;
        padding: 12px 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: 0.2s;
      }
      .nav-link i {
        width: 25px;
        font-size: 16px;
        margin-right: 8px;
        text-align: center;
      }
      .nav-link:hover,
      .nav-link.active {
        background-color: rgba(255, 255, 255, 0.2);
        font-weight: 600;
      }
      .btn-keluar {
        background-color: white;
        color: #d9534f;
        font-weight: 700;
        text-align: center;
        padding: 10px;
        border-radius: 6px;
        margin: 20px;
        text-decoration: none;
        display: block;
        font-size: 14px;
        transition: 0.3s;
      }
      .btn-keluar:hover {
        background-color: #f8f9fa;
        color: #c9302c;
      }
      .main-content {
        flex-grow: 1;
        padding: 30px 40px;
        background-color: #f4f6f9;
      }
      .header-title {
        color: #1f4e79;
        font-weight: 700;
        font-size: 26px;
        margin-bottom: 30px;
      }
      .bg-ungu {
        background-color: #7b68ee;
      }
      .bg-hijau {
        background-color: #66cdaa;
      }
      .stat-card {
        border-radius: 8px;
        color: white;
        padding: 20px;
        border: none;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        height: 110px;
        position: relative;
      }
      .stat-card .title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 15px;
      }
      .stat-card .number {
        font-size: 32px;
        font-weight: 700;
        line-height: 1;
      }
      .stat-card .icon {
        position: absolute;
        right: 20px;
        bottom: 20px;
        font-size: 30px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar d-flex flex-column">
        <div class="user-profile">
          <div class="avatar"><i class="fas fa-user-tie"></i></div>
          <div class="name">Joko Risanto</div>
          <div class="role">DOSEN</div>
        </div>

        <div class="nav-menu flex-grow-1">
          <a href="dashboard_dosen.html" class="nav-link active"
            ><i class="fas fa-home"></i> Dashboard</a
          >
          <a href="#" class="nav-link"
            ><i class="fas fa-calendar-alt"></i> Jadwal Mengajar</a
          >
          <a href="#" class="nav-link"
            ><i class="fas fa-edit"></i> Input Nilai</a
          >
          <a href="#" class="nav-link"
            ><i class="fas fa-users"></i> Mahasiswa Bimbingan</a
          >
        </div>

        <div class="mt-auto">
          <a href="login.html" class="btn-keluar">KELUAR</a>
        </div>
      </div>

      <div class="main-content">
        <div class="header-title">Selamat datang, Bapak/Ibu Dosen</div>

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <div class="stat-card bg-ungu">
              <div class="title">Total Matakuliah Diampu</div>
              <div class="number">3</div>
              <div class="icon"><i class="fas fa-book-open"></i></div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="stat-card bg-hijau">
              <div class="title">Total Mahasiswa Diajar</div>
              <div class="number">125</div>
              <div class="icon"><i class="fas fa-users"></i></div>
            </div>
          </div>
        </div>

        <div
          class="alert alert-info border-0 shadow-sm"
          style="border-radius: 8px"
        >
          <i class="fas fa-info-circle me-2"></i>
          <strong>Pengumuman:</strong> Batas akhir pengisian nilai Ujian Akhir
          Semester (UAS) adalah tanggal 30 Juni 2026.
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
