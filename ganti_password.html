<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD - Tukar Password</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* SIDEBAR STYLES */
      .sidebar {
        width: 230px;
        min-height: 100vh;
        background-color: #5b9bd5;
        color: white;
        position: sticky;
        top: 0;
        left: 0;
      }
      .user-profile {
        padding: 30px 15px 20px;
        text-align: center;
      }
      .user-profile .avatar {
        width: 65px;
        height: 65px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #5b9bd5;
        font-size: 32px;
        margin: 0 auto 10px;
      }
      .user-profile .name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .user-profile .role {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.9;
      }
      .nav-menu {
        margin-top: 10px;
      }
      .nav-link {
        color: white;
        padding: 12px 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: 0.2s;
      }
      .nav-link i {
        width: 25px;
        font-size: 16px;
        margin-right: 8px;
        text-align: center;
      }
      .nav-link:hover,
      .nav-link.active {
        background-color: rgba(255, 255, 255, 0.2);
        font-weight: 600;
      }
      .btn-keluar {
        background-color: white;
        color: #d9534f;
        font-weight: 700;
        text-align: center;
        padding: 10px;
        border-radius: 6px;
        margin: 20px;
        text-decoration: none;
        display: block;
        font-size: 14px;
        transition: 0.3s;
      }
      .btn-keluar:hover {
        background-color: #f8f9fa;
        color: #c9302c;
      }
      
      /* MAIN CONTENT STYLES */
      .main-content {
        flex-grow: 1;
        padding: 30px 40px;
        background-color: #f4f6f9;
      }
      .header-title {
        color: #1f4e79;
        font-weight: 700;
        font-size: 26px;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      
      <div class="sidebar d-flex flex-column">
        <div class="user-profile">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="name">M. Ahmad Fauzi</div>
          <div class="role">ADMIN</div>
        </div>
        <div class="nav-menu flex-grow-1">
          <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
          <a href="mahasiswa.html" class="nav-link"><i class="fas fa-address-card"></i> Data Mahasiswa</a>
          <a href="dosen.html" class="nav-link"><i class="fas fa-id-badge"></i> Data Dosen</a>
          <a href="matakuliah.html" class="nav-link"><i class="fas fa-book-open"></i> Data Matakuliah</a>
          <a href="tukar_password.html" class="nav-link"><i class="fas fa-key"></i> Tukar Password</a>
        </div>
        <div class="mt-auto">
          <a href="#" onclick="logoutSystem()" class="btn-keluar">KELUAR</a>
        </div>
      </div>

      <div class="main-content">
        <div class="header-title">Keamanan Akun</div>

        <div class="card border-0 shadow-sm" style="border-radius: 12px; max-width: 550px;">
          <div class="card-header text-white py-3" style="background-color: #1f4e79; border-top-left-radius: 12px; border-top-right-radius: 12px;">
            <h5 class="fw-bold mb-0">
              <i class="fas fa-shield-alt me-2"></i> Ganti Password
            </h5>
          </div>
          
          <div class="card-body p-4 p-md-5">
            <form id="formGantiPassword">
              
              <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Password Lama</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                  <input type="password" class="form-control" id="password_lama" name="password_lama" placeholder="Masukkan password saat ini" required />
                </div>
              </div>
              
              <hr class="my-4 text-muted">

              <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Password Baru</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-key"></i></span>
                  <input type="password" class="form-control" id="password_baru" name="password_baru" placeholder="Masukkan password baru" required />
                </div>
                <small class="text-muted mt-1 d-block">Gunakan kombinasi angka dan huruf agar lebih aman.</small>
              </div>

              <div class="mb-5">
                <label class="form-label fw-semibold text-secondary">Konfirmasi Password Baru</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fas fa-check-circle"></i></span>
                  <input type="password" class="form-control" id="konfirmasi_password" name="konfirmasi_password" placeholder="Ulangi password baru" required />
                </div>
              </div>

              <button type="submit" class="btn text-white w-100 py-3 fw-bold" style="background-color: #5b9bd5; border-radius: 8px; font-size: 16px;">
                <i class="fas fa-save me-2"></i> Simpan Perubahan Password
              </button>

            </form>
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // 1. Script untuk mengaktifkan menu sidebar sesuai halaman
      document.addEventListener("DOMContentLoaded", function () {
        let currentLocation = window.location.pathname.split("/").pop();
        if (currentLocation === "") currentLocation = "dashboard.html";
        
        const navLinks = document.querySelectorAll(".nav-menu .nav-link");
        navLinks.forEach((link) => {
          const linkHref = link.getAttribute("href");
          if (linkHref === currentLocation) {
            link.classList.add("active");
          }
        });
      });

      // 2. Script Proses Ganti Password
      document.getElementById("formGantiPassword").addEventListener("submit", function (e) {
        e.preventDefault();

        const passLama = document.getElementById("password_lama").value;
        const passBaru = document.getElementById("password_baru").value;
        const konfirmasiPass = document.getElementById("konfirmasi_password").value;

        // Validasi: Cek apakah password baru dan konfirmasi cocok
        if (passBaru !== konfirmasiPass) {
          Swal.fire({
            title: "Gagal!",
            text: "Konfirmasi password baru tidak cocok. Silakan ketik ulang dengan benar.",
            icon: "error",
            confirmButtonColor: '#d33'
          });
          return; 
        }

        // Siapkan data untuk dikirim
        const formData = new FormData();
        formData.append("password_lama", passLama);
        formData.append("password_baru", passBaru);

        // Fetch ke file PHP (Pastikan file api/update_password.php sudah kamu buat ya!)
        fetch("api/update_password.php", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success") {
              Swal.fire({
                title: "Berhasil!",
                text: "Password kamu berhasil diperbarui.",
                icon: "success",
                confirmButtonColor: '#5b9bd5'
              });
              document.getElementById("formGantiPassword").reset();
            } else {
              Swal.fire({
                title: "Gagal!",
                text: res.message || "Gagal memperbarui password.",
                icon: "error",
                confirmButtonColor: '#d33'
              });
            }
          })
          .catch((err) => {
            console.error(err);
            Swal.fire("Error", "Gagal terhubung ke server. Pastikan file API tersedia.", "error");
          });
      });

      // 3. Script Logout
      window.logoutSystem = function() {
        Swal.fire({
            title: 'Konfirmasi Logout',
            text: 'Apakah Anda yakin ingin keluar dari sistem?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#d9534f',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Ya, Keluar'
        }).then((result) => {
            if (result.isConfirmed) {
                // Bisa kamu tambahkan proses fetch ke file logout.php di sini kalau butuh hapus session
                window.location.href = "login.html";
            }
        });
      }
    </script>
  </body>
</html>
