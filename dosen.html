<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD - Data Dosen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      .sidebar {
        width: 230px;
        min-height: 100vh;
        background-color: #5b9bd5;
        color: white;
        position: sticky;
        top: 0;
        left: 0;
      }
      .user-profile {
        padding: 30px 15px 20px;
        text-align: center;
      }
      .user-profile .avatar {
        width: 65px;
        height: 65px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #5b9bd5;
        font-size: 32px;
        margin: 0 auto 10px;
      }
      .user-profile .name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .user-profile .role {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.9;
      }
      .nav-menu {
        margin-top: 10px;
      }
      .nav-link {
        color: white;
        padding: 12px 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: 0.2s;
      }
      .nav-link i {
        width: 25px;
        font-size: 16px;
        margin-right: 8px;
        text-align: center;
      }
      .nav-link:hover,
      .nav-link.active {
        background-color: rgba(255, 255, 255, 0.2);
        font-weight: 600;
      }
      .btn-keluar {
        background-color: white;
        color: #d9534f;
        font-weight: 700;
        text-align: center;
        padding: 10px;
        border-radius: 6px;
        margin: 20px;
        text-decoration: none;
        display: block;
        font-size: 14px;
        transition: 0.3s;
      }
      .btn-keluar:hover {
        background-color: #f8f9fa;
        color: #c9302c;
      }
      .main-content {
        flex-grow: 1;
        padding: 30px 40px;
        background-color: #f4f6f9;
      }
      .header-title {
        color: #1f4e79;
        font-weight: 700;
        font-size: 26px;
        margin-bottom: 30px;
      }
      .table-card {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        border: none;
      }
      .table-card-header {
        padding: 15px 20px;
        color: white;
        font-weight: 600;
        font-size: 16px;
      }
      .bg-hijau {
        background-color: #66cdaa;
      }
      .table-custom {
        width: 100%;
        margin-bottom: 0;
      }
      .table-custom th {
        background-color: #f8f9fa;
        color: #333;
        padding: 12px 15px;
        border-bottom: 2px solid #dee2e6;
        font-size: 14px;
        font-weight: 600;
      }
      .table-custom td {
        padding: 12px 15px;
        border-bottom: 1px solid #efefef;
        font-size: 14px;
        vertical-align: middle;
      }
      .pagination-wrapper {
        padding: 15px 20px;
        border-top: 1px solid #dee2e6;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar d-flex flex-column">
        <div class="user-profile">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="name">M. Ahmad Fauzi</div>
          <div class="role">ADMIN</div>
        </div>
        <div class="nav-menu flex-grow-1">
          <a href="dashboard.html" class="nav-link"
            ><i class="fas fa-home"></i> Dashboard</a
          >
          <a href="mahasiswa.html" class="nav-link"
            ><i class="fas fa-address-card"></i> Data Mahasiswa</a
          >
          <a href="dosen.html" class="nav-link active"
            ><i class="fas fa-id-badge"></i> Data Dosen</a
          >
          <a href="matakuliah.html" class="nav-link"
            ><i class="fas fa-book-open"></i> Data Matakuliah</a
          >
        </div>
        <div class="mt-auto">
          <a href="login.html" class="btn-keluar">KELUAR</a>
        </div>
      </div>

      <div class="main-content">
        <div class="header-title">Kelola Data Dosen</div>

        <div class="card table-card">
          <div
            class="table-card-header bg-hijau d-flex justify-content-between align-items-center"
          >
            <span>Daftar Seluruh Dosen</span>
            <button
              class="btn btn-light btn-sm fw-bold text-dark"
              data-bs-toggle="modal"
              data-bs-target="#modalTambahDosen"
            >
              <i class="fas fa-plus me-1"></i> Tambah Dosen
            </button>
          </div>

          <div class="table-responsive">
            <table class="table-custom table table-hover">
              <thead>
                <tr>
                  <th>No</th>
                  <th>NIDN</th>
                  <th>Nama Dosen</th>
                  <th>Email</th>
                  <th>No HP</th>
                  <th>L/P</th>
                  <th>Alamat</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-dosen-full"></tbody>
            </table>
          </div>

          <div
            class="pagination-wrapper d-flex justify-content-between align-items-center"
          >
            <div id="page-info" class="small text-muted">
              Showing 0 to 0 of 0 entries
            </div>
            <nav aria-label="Page navigation">
              <ul
                class="pagination pagination-sm mb-0"
                id="pagination-controls"
              ></ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalTambahDosen" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-hijau text-white">
            <h5 class="modal-title">Tambah Data Dosen</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formTambahDosen">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">NIDN</label>
                <input
                  type="text"
                  class="form-control"
                  id="tambahNIDN"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Nama Dosen</label>
                <input
                  type="text"
                  class="form-control"
                  id="tambahNama"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="tambahEmail" />
              </div>
              <div class="mb-3">
                <label class="form-label">No HP</label>
                <input type="text" class="form-control" id="tambahNoHP" />
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Kelamin</label>
                <select class="form-select" id="tambahJK">
                  <option value="L">Laki-laki</option>
                  <option value="P">Perempuan</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea
                  class="form-control"
                  id="tambahAlamat"
                  rows="2"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button type="submit" class="btn text-white bg-hijau">
                Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalEditDosen" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title fw-bold">Edit Data Dosen</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formEditDosen">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">NIDN</label>
                <input
                  type="text"
                  class="form-control bg-light"
                  id="editNIDN"
                  readonly
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Nama Dosen</label>
                <input
                  type="text"
                  class="form-control"
                  id="editNama"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="editEmail" />
              </div>
              <div class="mb-3">
                <label class="form-label">No HP</label>
                <input type="text" class="form-control" id="editNoHP" />
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Kelamin</label>
                <select class="form-select" id="editJK">
                  <option value="L">Laki-laki</option>
                  <option value="P">Perempuan</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea
                  class="form-control"
                  id="editAlamat"
                  rows="2"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button type="submit" class="btn btn-warning fw-bold">
                Update Data
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let dataDosen = [];
      let currentPage = 1;
      const rowsPerPage = 10;

      document.addEventListener("DOMContentLoaded", function () {
        loadDataDosen();
      });

      // 1. Ambil Data Dosen (Tembak ke api/get_dosen.php kamu)
      function loadDataDosen() {
        fetch("api/get_dosen.php")
          .then((res) => res.json())
          .then((res) => {
            dataDosen = res.data ? res.data : res;
            renderTable();
          })
          .catch((err) => {
            console.log(err);
            document.getElementById("tbody-dosen-full").innerHTML =
              `<tr><td colspan="8" class="text-center text-danger">Gagal memuat data.</td></tr>`;
          });
      }

      // 2. Render Tabel dengan Paging
      function renderTable() {
        const tbody = document.getElementById("tbody-dosen-full");
        tbody.innerHTML = "";

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = Math.min(startIndex + rowsPerPage, dataDosen.length);
        const paginatedData = dataDosen.slice(startIndex, endIndex);

        if (paginatedData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">Belum ada data dosen.</td></tr>`;
        } else {
          paginatedData.forEach((dsn, index) => {
            const nomorUrut = startIndex + index + 1;
            tbody.innerHTML += `
                    <tr>
                        <td>${nomorUrut}</td>
                        <td class="fw-bold text-secondary">${dsn.nidn}</td>
                        <td>${dsn.nama_dosen || dsn.nama}</td>
                        <td>${dsn.email || "-"}</td>
                        <td>${dsn.no_hp || "-"}</td>
                        <td><span class="badge ${dsn.jenis_kelamin === "L" ? "bg-primary" : "bg-danger"}">${dsn.jenis_kelamin || "-"}</span></td>
                        <td>${dsn.alamat || "-"}</td>
                        <td class="text-center">
                            <button onclick="bukaModalEdit('${dsn.nidn}', '${dsn.nama_dosen || dsn.nama}', '${dsn.email || ""}', '${dsn.no_hp || ""}', '${dsn.jenis_kelamin}', '${dsn.alamat || ""}')" class="btn btn-sm btn-warning text-white me-1"><i class="fas fa-edit"></i></button>
                            <button onclick="hapusDosen('${dsn.nidn}')" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
          });
        }

        document.getElementById("page-info").innerText =
          `Showing ${dataDosen.length === 0 ? 0 : startIndex + 1} to ${endIndex} of ${dataDosen.length} entries`;
        setupPaginationControls();
      }

      function setupPaginationControls() {
        const controlsWrapper = document.getElementById("pagination-controls");
        controlsWrapper.innerHTML = "";
        const totalPages = Math.max(
          1,
          Math.ceil(dataDosen.length / rowsPerPage),
        );

        controlsWrapper.innerHTML += `
            <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="${currentPage === 1 ? "return false;" : `changePage(${currentPage - 1})`}">Previous</a>
            </li>
        `;
        for (let i = 1; i <= totalPages; i++) {
          controlsWrapper.innerHTML += `
                <li class="page-item ${currentPage === i ? "active" : ""}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
        }
        controlsWrapper.innerHTML += `
            <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="${currentPage === totalPages ? "return false;" : `changePage(${currentPage + 1})`}">Next</a>
            </li>
        `;
      }

      window.changePage = function (page) {
        currentPage = page;
        renderTable();
      };

      // 3. Tambah Dosen (POST ke api/add_dosen.php)
      document
        .getElementById("formTambahDosen")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const nidn = document.getElementById("tambahNIDN").value;
          const nama = document.getElementById("tambahNama").value;
          const email = document.getElementById("tambahEmail").value;
          const no_hp = document.getElementById("tambahNoHP").value;
          const jk = document.getElementById("tambahJK").value;
          const alamat = document.getElementById("tambahAlamat").value;

          fetch("api/add_dosen.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `nidn=${nidn}&nama=${nama}&email=${email}&no_hp=${no_hp}&jenis_kelamin=${jk}&alamat=${alamat}`,
          })
            .then((res) => res.json())
            .then((res) => {
              alert("Data dosen berhasil disimpan!");
              document.getElementById("formTambahDosen").reset();
              bootstrap.Modal.getInstance(
                document.getElementById("modalTambahDosen"),
              ).hide();
              loadDataDosen();
            })
            .catch((err) => alert("Gagal menambah data dosen!"));
        });

      // 4. Buka Modal Edit
      window.bukaModalEdit = function (nidn, nama, email, no_hp, jk, alamat) {
        document.getElementById("editNIDN").value = nidn;
        document.getElementById("editNama").value = nama;
        document.getElementById("editEmail").value = email;
        document.getElementById("editNoHP").value = no_hp;
        document.getElementById("editJK").value = jk;
        document.getElementById("editAlamat").value = alamat;
        new bootstrap.Modal(document.getElementById("modalEditDosen")).show();
      };

      // 5. Update Dosen (POST ke api/update_dosen.php)
      document
        .getElementById("formEditDosen")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const nidn = document.getElementById("editNIDN").value;
          const nama = document.getElementById("editNama").value;
          const email = document.getElementById("editEmail").value;
          const no_hp = document.getElementById("editNoHP").value;
          const jk = document.getElementById("editJK").value;
          const alamat = document.getElementById("editAlamat").value;

          fetch("api/update_dosen.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `nidn=${nidn}&nama=${nama}&email=${email}&no_hp=${no_hp}&jenis_kelamin=${jk}&alamat=${alamat}`,
          })
            .then((res) => res.json())
            .then((res) => {
              alert("Data dosen berhasil diperbarui!");
              bootstrap.Modal.getInstance(
                document.getElementById("modalEditDosen"),
              ).hide();
              loadDataDosen();
            })
            .catch((err) => alert("Gagal memperbarui data dosen!"));
        });

      // 6. Hapus Dosen (POST ke api/delete_dosen.php)
      window.hapusDosen = function (nidn) {
        if (
          confirm(
            `Apakah Anda yakin ingin menghapus dosen dengan NIDN ${nidn}?`,
          )
        ) {
          fetch("api/delete_dosen.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `nidn=${nidn}`,
          })
            .then((res) => res.json())
            .then((res) => {
              alert("Data dosen berhasil dihapus!");
              loadDataDosen();
            })
            .catch((err) => alert("Gagal menghapus data!"));
        }
      };
    </script>
  </body>
</html>
