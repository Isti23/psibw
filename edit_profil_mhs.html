<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f0f2f5;
            font-family:Segoe UI, sans-serif;
        }

        .container-box{
            max-width:700px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.05);
        }

        .foto-preview{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #659be0;
            display:block;
            margin:auto;
        }

        .title{
            font-weight:700;
            color:#1a4971;
        }

        .btn-simpan{
            background:#659be0;
            border:none;
            padding:12px;
            font-weight:600;
        }

        .btn-simpan:hover{
            background:#4d88d6;
        }
    </style>
</head>
<body>

<div class="container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <h3 class="title m-0">
        Edit Profil Mahasiswa
    </h3>

    <a href="dashboard_mhs.html" class="btn btn-secondary">
        ← Kembali
    </a>

</div>

    <form id="formEditProfile" enctype="multipart/form-data">

        <div class="text-center mb-4">
            <img src="foto/default.jpg" id="previewFoto" class="foto-preview">

            <div class="mt-3">
                <input type="file" class="form-control" id="foto" name="foto" accept="image/*">
            </div>
        </div>


        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email">
        </div>
<div class="mb-3">
    <label class="form-label">Nomor HP</label>
    <input type="text"
           class="form-control"
           id="no_hp"
           name="no_hp">
</div>

<div class="mb-3">
    <label class="form-label">Alamat</label>
    <textarea class="form-control"
              id="alamat"
              name="alamat"
              rows="3"></textarea>
</div>

    
<a href="ganti_password_mhs.html"
   class="btn btn-warning w-100 mb-3">

    <i class="fas fa-key"></i>
    Ganti Password

</a>

        <button type="submit" class="btn btn-primary btn-simpan w-100">
            Simpan Perubahan
        </button>
        <button type="button" class="btn btn-danger w-100 mt-2" id="btnHapusFoto">
    <i class="fas fa-trash"></i> Hapus Foto Profil
</button>

    </form>

</div>

<script>

    // Preview foto sebelum upload
    document.getElementById('foto').addEventListener('change', function(e){

        const file = e.target.files[0];

        if(file){
            document.getElementById('previewFoto').src = URL.createObjectURL(file);
        }

    });

    // Load data mahasiswa
    fetch('api/get_profile_mhs.php')
    .then(res => res.json())
    .then(result => {

        if(result.status === 'success'){

            const mhs = result.data;

            document.getElementById('email').value = mhs.email || '';
document.getElementById('no_hp').value =
mhs.no_hp || '';

document.getElementById('alamat').value =
mhs.alamat || '';


            if(mhs.foto && mhs.foto !== 'default.jpg'){
                document.getElementById('previewFoto').src = 'foto/' + mhs.foto;
            }

        }

    });

    // Submit update profile
    document.getElementById('formEditProfile')
    .addEventListener('submit', function(e){

        e.preventDefault();

        const formData = new FormData(this);

        fetch('api/update_profile_mhs.php', {
            method:'POST',
            body:formData
        })
        .then(res => res.json())
        .then(result => {

            alert(result.message);

            if(result.status === 'success'){
                window.location.href = 'dashboard_mhs.html';
            }

        })
        .catch(err => {
            console.error(err);
            alert('Gagal update profil');
        });

    });
document.getElementById('btnHapusFoto')
.addEventListener('click', function(){

    if(confirm('Yakin ingin menghapus foto profil?')){

        fetch('api/hapus_foto_mhs.php', {
            method:'POST'
        })
        .then(res => res.json())
        .then(result => {

            alert(result.message);

            if(result.status === 'success'){
                location.reload();
            }

        })
        .catch(err => {
            console.error(err);
            alert('Gagal menghapus foto');
        });

    }

});
</script>

</body>
</html>
