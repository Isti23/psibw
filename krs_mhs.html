<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRS Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #659be0;
            color: white;
            position: sticky;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .user-profile {
            padding: 40px 15px 20px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            overflow: hidden;
            margin: auto;
            margin-bottom: 15px;
            border: 3px solid rgba(255, 255, 255, 0.5);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar i {
            font-size: 45px;
            color: #659be0;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .role {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-menu {
            margin-top: 20px;
            flex-grow: 1;
        }

        .nav-link {
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-link i {
            width: 30px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-link.active {
            background: #8cbcf0;
            border-left-color: white;
            font-weight: 600;
        }

        .submenu {
            background: #5b8fd1;
        }

        .submenu-link {
            display: block;
            padding: 12px 25px 12px 60px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .submenu-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .submenu-link.active {
            background: rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }

        .btn-keluar-wrapper {
            padding: 20px;
            margin-top: auto;
        }

        .btn-keluar {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            background: #dce4eb;
            color: #b72b2b;
            font-weight: 800;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .main-content {
            flex: 1;
            padding: 35px;
        }

        .title-page {
            font-size: 35px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .detail-card {
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
        }

        .detail-card h4 {
            font-weight: 800;
            margin-bottom: 30px;
        }

        table {
            background: white;
        }

        .btn-simpan {
            background: #659be0;
            border: none;
            padding: 12px 25px;
            font-weight: 700;
            border-radius: 10px;
            color: white;
        }

        .btn-simpan:hover {
            background: #4d88d6;
        }

        @media(max-width:768px) {

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div class="sidebar">
            <div class="user-profile">
                <div class="avatar" id="sidebar-foto">
                    <i class="fas fa-user"></i>
                </div>
                <div class="name" id="sidebar-nama">
                    Memuat...
                </div>
                <div class="role">
                    MAHASISWA
                </div>
            </div>

            <div class="nav-menu">
                <a href="dashboard_mhs.html" class="nav-link">
                    <i class="fas fa-house"></i>
                    Dashboard
                </a>

                <a href="#" class="nav-link" onclick="toggleMenu('profilMenu')">
                    <i class="fas fa-user"></i>
                    Profil Mahasiswa
                    <span style="margin-left:auto;">
                        <i class="fas fa-chevron-down"></i>
                    </span>
                </a>
                <div id="profilMenu" class="submenu" style="display:none;">
                    <a href="biodata_mhs.html" class="submenu-link">
                        Biodata
                    </a>
                    <a href="edit_profil_mhs.html" class="submenu-link">
                        Edit Profil
                    </a>
                </div>
                <a href="#" class="nav-link active" onclick="toggleMenu('akademikMenu')">
                    <i class="fas fa-book"></i>
                    Akademik
                    <span style="margin-left:auto;">
                        <i class="fas fa-chevron-down"></i>
                    </span>
                </a>
                <div id="akademikMenu" class="submenu" style="display:block;">
                    <a href="krs_mhs.html" class="submenu-link active">
                        KRS
                    </a>
                    <a href="jadwal_mhs.html" class="submenu-link">
                        Jadwal Kuliah
                    </a>
                    <a href="nilai_mhs.html" class="submenu-link">
                        Nilai
                    </a>
                </div>
            </div>

            <div class="btn-keluar-wrapper">
                <a href="login.html" class="btn-keluar">
                    KELUAR
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="title-page">
                Pengisian KRS
            </div>
            <div class="detail-card">
                <h4>
                    Daftar Mata Kuliah Tersedia
                </h4>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Pilih</th>
                                <th>Kode MK</th>
                                <th>Mata Kuliah</th>
                                <th>SKS</th>
                                <th>Hari</th>
                                <th>Jam</th>
                                <th>Dosen</th>
                                <th>Ruangan</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-krs">
                            <tr>
                                <td colspan="8" class="text-center">
                                    Memuat data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button class="btn-simpan mt-3" id="btnSimpanKrs">
                    Simpan KRS
                </button>
            </div>
        </div>
    </div>

    <script>
        fetch('api/get_profile_mhs.php')
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    const mhs = result.data;
                    document.getElementById('sidebar-nama').innerText =
                        mhs.nama_mhs;
                    if (mhs.foto && mhs.foto !== 'default.jpg') {
                        document.getElementById('sidebar-foto').innerHTML =
                            `<img src="foto/${mhs.foto}">`;
                    }
                }
            });

        fetch('api/get_krs.php')
            .then(res => res.json())
            .then(result => {
                console.log(result);
                const tbody =
                    document.getElementById('tbody-krs');
                tbody.innerHTML = '';
                if (result.status === 'success') {
                    result.data.forEach(krs => {
                        tbody.innerHTML += `
                <tr>
                    <td>
                        <input type="checkbox"
                               class="check-krs"
                               value="${krs.id_jadwal}">
                    </td>
                    <td>${krs.kode_mk}</td>
                    <td>${krs.nama_mk}</td>
                    <td>${krs.sks}</td>
                    <td>${krs.hari}</td>
                    <td>
                        ${krs.jam_mulai}
                        -
                        ${krs.jam_selesai}
                    </td>
                    <td>${krs.nama_dosen}</td>
                    <td>${krs.ruangan}</td>
                </tr>
                `;
                    });
                } else {
                    tbody.innerHTML = `
            <tr>
                <td colspan="8"
                    class="text-center text-danger">
                    Gagal mengambil data
                </td>
            </tr>
            `;
                }
            })
            .catch(err => {
                console.log(err);
                document.getElementById('tbody-krs').innerHTML = `
        <tr>
            <td colspan="8"
                class="text-center text-danger">
                Error mengambil data
            </td>
        </tr>
        `;
            });
        document.getElementById('btnSimpanKrs')
            .addEventListener('click', () => {
                const checked =
                    document.querySelectorAll('.check-krs:checked');
                let data = [];
                checked.forEach(item => {
                    data.push(item.value);
                });
                if (data.length === 0) {
                    alert('Pilih mata kuliah dulu');
                    return;
                }
                if (!confirm('Cek kembali mata kuliah pilihan anda?')) {
                    return;
                }
                fetch('api/simpan_krs.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        jadwal: data
                    })
                })
                    .then(res => res.json())
                    .then(result => {
                        alert(result.message);
                    })
                    .catch(err => {
                        console.log(err);
                        alert('Gagal menyimpan KRS');
                    });
            });

        function toggleMenu(menuId) {
            const menu =
                document.getElementById(menuId);
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }
    </script>

</body>

</html>
