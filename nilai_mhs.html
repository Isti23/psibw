<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nilai Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        body{
            background:#f0f2f5;
            font-family:'Segoe UI',sans-serif;
            margin:0;
        }

        .sidebar{
            width:250px;
            min-height:100vh;
            background:#659be0;
            color:white;
            display:flex;
            flex-direction:column;
        }

        .user-profile{
            padding:40px 15px 20px;
            text-align:center;
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            overflow:hidden;
            background:white;
            margin:auto;
            margin-bottom:15px;
        }

        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .avatar i{
            font-size:45px;
            color:#659be0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100%;
        }

        .name{
            font-weight:600;
        }

        .role{
            font-size:14px;
            font-weight:700;
        }

        .nav-menu{
            margin-top:20px;
            flex-grow:1;
        }

        .nav-link{
            color:white;
            padding:15px 25px;
            text-decoration:none;
            display:flex;
            align-items:center;
            border-left:4px solid transparent;
        }

        .nav-link:hover{
            background:rgba(255,255,255,0.1);
            color:white;
        }

        .nav-link.active{
            background:#8cbcf0;
            border-left-color:white;
            font-weight:600;
        }

        .submenu{
            background:#5b8fd1;
        }

        .submenu-link{
            display:block;
            padding:12px 25px 12px 60px;
            color:white;
            text-decoration:none;
        }

        .submenu-link:hover{
            background:rgba(255,255,255,0.1);
            color:white;
        }

        .submenu-link.active{
            background:rgba(255,255,255,0.15);
            font-weight:600;
        }

        .btn-keluar-wrapper{
            padding:20px;
            margin-top:auto;
        }

        .btn-keluar{
            background:#dce4eb;
            color:#b72b2b;
            font-weight:800;
            padding:12px;
            border-radius:10px;
            text-decoration:none;
            display:block;
            text-align:center;
        }

        .main-content{
            flex:1;
            padding:35px;
        }

        .title-page{
            font-size:35px;
            font-weight:800;
            color:#1e293b;
            margin-bottom:25px;
        }

        .card-nilai{
            background:white;
            border-radius:25px;
            padding:35px;
            box-shadow:0 5px 15px rgba(0,0,0,0.04);
        }

        .badge-nilai{
            background:#659be0;
            color:white;
            padding:8px 14px;
            border-radius:10px;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="user-profile">

            <div class="avatar"
                 id="sidebar-foto">

                <i class="fas fa-user"></i>

            </div>

            <div class="name"
                 id="sidebar-nama">

                Memuat...

            </div>

            <div class="role">

                MAHASISWA

            </div>

        </div>

        <div class="nav-menu">

            <a href="dashboard_mhs.html"
               class="nav-link">

                <i class="fas fa-house"></i>
                Dashboard

            </a>

            <a href="#"
               class="nav-link"
               onclick="toggleMenu('profilMenu')">

                <i class="fas fa-user"></i>
                Profil Mahasiswa

            </a>

            <div id="profilMenu"
                 class="submenu"
                 style="display:none;">

                <a href="biodata_mhs.html"
                   class="submenu-link">

                    Biodata

                </a>

                <a href="edit_profil_mhs.html"
                   class="submenu-link">

                    Edit Profil

                </a>

            </div>

            <a href="#"
               class="nav-link active"
               onclick="toggleMenu('akademikMenu')">

                <i class="fas fa-book"></i>
                Akademik

            </a>

            <div id="akademikMenu"
                 class="submenu"
                 style="display:block;">

                <a href="krs_mhs.html"
                   class="submenu-link">

                    KRS

                </a>

                <a href="jadwal_mhs.html"
                   class="submenu-link">

                    Jadwal Kuliah

                </a>

                <a href="nilai_mhs.html"
                   class="submenu-link active">

                    Nilai

                </a>

            </div>

        </div>

        <div class="btn-keluar-wrapper">

            <a href="login.html"
               class="btn-keluar">

                KELUAR

            </a>

        </div>

    </div>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="title-page">

            Nilai Mahasiswa

        </div>

        <div class="card-nilai">

            <div class="table-responsive">

                <table class="table table-bordered align-middle">

                    <thead class="table-primary">

                        <tr>

                            <th>No</th>
                            <th>Kode MK</th>
                            <th>Mata Kuliah</th>
                            <th>Dosen</th>
                            <th>Nilai</th>
                            <th>Huruf Mutu</th>

                        </tr>

                    </thead>

                    <tbody id="tbody-nilai">

                        <tr>

                            <td colspan="6"
                                class="text-center">

                                Memuat data...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

/* ================= LOAD PROFILE ================= */

fetch('api/get_profile_mhs.php')

.then(res => res.json())

.then(result => {

    if(result.status === 'success'){

        const mhs = result.data;

        document.getElementById('sidebar-nama')
        .innerText = mhs.nama_mhs;

        if(mhs.foto &&
           mhs.foto !== 'default.jpg'){

            document.getElementById('sidebar-foto')
            .innerHTML =
            `<img src="foto/${mhs.foto}">`;

        }

    }

});

/* ================= LOAD NILAI ================= */

fetch('api/get_nilai_mhs.php')

.then(response => response.json())

.then(result => {

    const tbody =
    document.getElementById('tbody-nilai');

    tbody.innerHTML = '';

    if(result.status === 'success'){

        if(result.data.length === 0){

            tbody.innerHTML = `

            <tr>

                <td colspan="6"
                    class="text-center">

                    Belum ada data nilai

                </td>

            </tr>

            `;

            return;

        }

        result.data.forEach((item,index)=>{

            tbody.innerHTML += `

            <tr>

                <td>${index + 1}</td>

                <td class="fw-bold text-primary">

                    ${item.kode_mk}

                </td>

                <td>

                    ${item.nama_mk}

                </td>

                <td>

                    ${item.nama_dosen}

                </td>

                <td>

                    ${item.nilai_akhir
                    ? item.nilai_akhir
                    : '-'}

                </td>

                <td>

                    <span class="badge-nilai">

                        ${item.huruf_mutu
                        ? item.huruf_mutu
                        : '-'}

                    </span>

                </td>

            </tr>

            `;

        });

    }else{

        tbody.innerHTML = `

        <tr>

            <td colspan="6"
                class="text-center text-danger">

                Gagal mengambil data

            </td>

        </tr>

        `;

    }

})

.catch(error => {

    console.log(error);

});

/* ================= TOGGLE MENU ================= */

function toggleMenu(menuId){

    const menu =
    document.getElementById(menuId);

    if(menu.style.display === 'block'){

        menu.style.display = 'none';

    }else{

        menu.style.display = 'block';

    }

}

</script>

</body>
</html>
