<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganti Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f0f2f5;
    font-family:Segoe UI,sans-serif;
}

.container-box{
    max-width:600px;
    margin:50px auto;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.title{
    color:#1a4971;
    font-weight:700;
}

</style>

</head>
<body>

<div class="container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3 class="title m-0">
            Ganti Password
        </h3>

        <a href="edit_profil_mhs.html"
           class="btn btn-secondary">

            ← Kembali

        </a>

    </div>

    <form id="formPassword">

        <div class="mb-3">

            <label class="form-label">
                Password Lama
            </label>

            <input
                type="password"
                class="form-control"
                id="password_lama"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password Baru
            </label>

            <input
                type="password"
                class="form-control"
                id="password_baru"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Konfirmasi Password Baru
            </label>

            <input
                type="password"
                class="form-control"
                id="konfirmasi_password"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100">

            Simpan Password

        </button>

    </form>

</div>

<script>

document.getElementById('formPassword')
.addEventListener('submit', function(e){

    e.preventDefault();

    const password_lama =
    document.getElementById('password_lama').value;

    const password_baru =
    document.getElementById('password_baru').value;

    const konfirmasi_password =
    document.getElementById('konfirmasi_password').value;

    if(
        !password_lama ||
        !password_baru ||
        !konfirmasi_password
    ){
        alert('Semua field wajib diisi');
        return;
    }

    if(password_baru !== konfirmasi_password){

        alert('Konfirmasi password tidak cocok');
        return;

    }

    fetch('api/update_password.php',{

        method:'POST',

        headers:{
            'Content-Type':'application/x-www-form-urlencoded'
        },

        body:

        'password_lama=' +
        encodeURIComponent(password_lama)

        + '&password_baru=' +

        encodeURIComponent(password_baru)

    })

    .then(res => res.json())

    .then(result => {

        alert(result.message);

        if(result.status === 'success'){

            window.location.href =
            'edit_profile_mhs.html';

        }

    })

    .catch(err => {

        console.error(err);

        alert('Gagal mengganti password');

    });

});

</script>

</body>
</html>
