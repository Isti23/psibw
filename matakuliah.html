<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD - Data Matakuliah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow-x: hidden;
      }
      .sidebar {
        width: 230px;
        min-height: 100vh;
        background-color: #5b9bd5;
        color: white;
        position: sticky;
        top: 0;
        left: 0;
      }
      .user-profile {
        padding: 30px 15px 20px;
        text-align: center;
      }
      .user-profile .avatar {
        width: 65px;
        height: 65px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #5b9bd5;
        font-size: 32px;
        margin: 0 auto 10px;
      }
      .user-profile .name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .user-profile .role {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.9;
      }
      .nav-menu {
        margin-top: 10px;
      }
      .nav-link {
        color: white;
        padding: 12px 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: 0.2s;
      }
      .nav-link i {
        width: 25px;
        font-size: 16px;
        margin-right: 8px;
        text-align: center;
      }
      .nav-link:hover,
      .nav-link.active {
        background-color: rgba(255, 255, 255, 0.2);
        font-weight: 600;
      }
      .btn-keluar {
        background-color: white;
        color: #d9534f;
        font-weight: 700;
        text-align: center;
        padding: 10px;
        border-radius: 6px;
        margin: 20px;
        text-decoration: none;
        display: block;
        font-size: 14px;
        transition: 0.3s;
      }
      .btn-keluar:hover {
        background-color: #f8f9fa;
        color: #c9302c;
      }
      .main-content {
        flex-grow: 1;
        padding: 30px 40px;
        background-color: #f4f6f9;
      }
      .header-title {
        color: #1f4e79;
        font-weight: 700;
        font-size: 26px;
        margin-bottom: 30px;
      }
      .table-card {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        border: none;
      }
      .table-card-header {
        padding: 15px 20px;
        color: white;
        font-weight: 600;
        font-size: 16px;
      }
      /* Warna khusus matakuliah menyesuaikan dashboard */
      .bg-matkul {
        background-color: #bda641; 
      }
      .table-custom {
        width: 100%;
        margin-bottom: 0;
      }
      .table-custom th {
        background-color: #f8f9fa;
        color: #333;
        padding: 12px 15px;
        border-bottom: 2px solid #dee2e6;
        font-size: 14px;
        font-weight: 600;
      }
      .table-custom td {
        padding: 12px 15px;
        border-bottom: 1px solid #efefef;
        font-size: 14px;
        vertical-align: middle;
      }
      .pagination-wrapper {
        padding: 15px 20px;
        border-top: 1px solid #dee2e6;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar d-flex flex-column">
        <div class="user-profile">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="name">M. Ahmad Fauzi</div>
          <div class="role">ADMIN</div>
        </div>
        <div class="nav-menu flex-grow-1">
          <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
          <a href="mahasiswa.html" class="nav-link"><i class="fas fa-address-card"></i> Data Mahasiswa</a>
          <a href="dosen.html" class="nav-link"><i class="fas fa-id-badge"></i> Data Dosen</a>
          <a href="matakuliah.html" class="nav-link"><i class="fas fa-book-open"></i> Data Matakuliah</a>
          <a href="jadwal.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Kelola Jadwal</a>
        </div>
        <div class="mt-auto">
          <a href="login.html" class="btn-keluar">KELUAR</a>
        </div>
      </div>

      <div class="main-content">
        <div class="header-title">Kelola Data Mata Kuliah</div>

        <div class="card table-card">
          <div class="table-card-header bg-matkul d-flex justify-content-between align-items-center">
            <span>Daftar Seluruh Mata Kuliah</span>
            <button class="btn btn-light btn-sm fw-bold text-dark" data-bs-toggle="modal" data-bs-target="#modalTambahMK">
              <i class="fas fa-plus me-1"></i> Tambah Matkul
            </button>
          </div>

          <div class="table-responsive">
            <table class="table-custom table table-hover">
              <thead>
                <tr>
                  <th width="5%">No</th>
                  <th width="15%">Kode MK</th>
                  <th width="40%">Nama Mata Kuliah</th>
                  <th width="10%" class="text-center">SKS</th>
                  <th width="15%" class="text-center">Semester</th>
                  <th width="15%" class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-mk-full"></tbody>
            </table>
          </div>

          <div class="pagination-wrapper d-flex justify-content-between align-items-center">
            <div id="page-info" class="small text-muted">Showing 0 to 0 of 0 entries</div>
            <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0" id="pagination-controls"></ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalTambahMK" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-matkul text-white">
            <h5 class="modal-title">Tambah Mata Kuliah</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="formTambahMK">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Kode MK</label>
                <input type="text" class="form-control" id="tambahKode" required placeholder="Contoh: IS1024" />
              </div>
              <div class="mb-3">
                <label class="form-label">Nama Mata Kuliah</label>
                <input type="text" class="form-control" id="tambahNama" required />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">SKS</label>
                  <input type="number" class="form-control" id="tambahSKS" required min="1" max="6" value="3" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Semester</label>
                  <input type="number" class="form-control" id="tambahSemester" required min="1" max="8" value="1" />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn text-white bg-matkul">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalEditMK" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title fw-bold">Edit Mata Kuliah</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formEditMK">
            <div class="modal-body">
              <input type="hidden" id="editIdMK" />
              <div class="mb-3">
                <label class="form-label">Kode MK</label>
                <input type="text" class="form-control" id="editKode" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Nama Mata Kuliah</label>
                <input type="text" class="form-control" id="editNama" required />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">SKS</label>
                  <input type="number" class="form-control" id="editSKS" required min="1" max="6" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Semester</label>
                  <input type="number" class="form-control" id="editSemester" required min="1" max="8" />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-warning fw-bold">Update Data</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let dataMK = [];
      let currentPage = 1;
      const rowsPerPage = 10;

      document.addEventListener("DOMContentLoaded", function () {
        loadDataMatkul();
      });

      function loadDataMatkul() {
        fetch("api/get_matakuliah.php")
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success") {
              dataMK = res.data ? res.data : [];
              renderTable();
            } else {
              console.log(res.message);
            }
          })
          .catch((err) => {
            console.log(err);
            document.getElementById("tbody-mk-full").innerHTML = `<tr><td colspan="6" class="text-center text-danger">Gagal memuat data.</td></tr>`;
          });
      }

      // 2. Render Tabel (Sekarang tanpa tombol Hapus)
      function renderTable() {
        const tbody = document.getElementById("tbody-mk-full");
        tbody.innerHTML = "";

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = Math.min(startIndex + rowsPerPage, dataMK.length);
        const paginatedData = dataMK.slice(startIndex, endIndex);

        if (paginatedData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Belum ada data mata kuliah.</td></tr>`;
        } else {
          paginatedData.forEach((mk, index) => {
            const nomorUrut = startIndex + index + 1;
            const safeNama = mk.nama_mk.replace(/'/g, "\\'"); 
            
            tbody.innerHTML += `
              <tr>
                  <td>${nomorUrut}</td>
                  <td class="fw-bold text-secondary">${mk.kode_mk}</td>
                  <td>${mk.nama_mk}</td>
                  <td class="text-center"><span class="badge bg-secondary">${mk.sks} SKS</span></td>
                  <td class="text-center">Semester ${mk.semester}</td>
                  <td class="text-center">
                      <button onclick="bukaModalEdit('${mk.id_mk}', '${mk.kode_mk}', '${safeNama}', '${mk.sks}', '${mk.semester}')" class="btn btn-sm btn-warning text-white px-3">
                        <i class="fas fa-edit me-1"></i> Edit
                      </button>
                  </td>
              </tr>
            `;
          });
        }

        document.getElementById("page-info").innerText = `Showing ${dataMK.length === 0 ? 0 : startIndex + 1} to ${endIndex} of ${dataMK.length} entries`;
        setupPaginationControls();
      }

      function setupPaginationControls() {
        const controlsWrapper = document.getElementById("pagination-controls");
        controlsWrapper.innerHTML = "";
        const totalPages = Math.max(1, Math.ceil(dataMK.length / rowsPerPage));

        controlsWrapper.innerHTML += `
            <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="${currentPage === 1 ? "return false;" : `changePage(${currentPage - 1})`}">Previous</a>
            </li>
        `;
        for (let i = 1; i <= totalPages; i++) {
          controlsWrapper.innerHTML += `
                <li class="page-item ${currentPage === i ? "active" : ""}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
        }
        controlsWrapper.innerHTML += `
            <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="${currentPage === totalPages ? "return false;" : `changePage(${currentPage + 1})`}">Next</a>
            </li>
        `;
      }

      window.changePage = function (page) {
        currentPage = page;
        renderTable();
      };

      document.getElementById("formTambahMK").addEventListener("submit", function (e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append("kode_mk", document.getElementById("tambahKode").value);
        formData.append("nama_mk", document.getElementById("tambahNama").value);
        formData.append("sks", document.getElementById("tambahSKS").value);
        formData.append("semester", document.getElementById("tambahSemester").value);

        fetch("api/add_matakuliah.php", { method: "POST", body: formData })
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success") {
                alert(res.message);
                document.getElementById("formTambahMK").reset();
                bootstrap.Modal.getInstance(document.getElementById("modalTambahMK")).hide();
                loadDataMatkul();
            } else {
                alert("Gagal: " + res.message);
            }
          })
          .catch((err) => alert("Terjadi kesalahan sistem saat menambah data!"));
      });

      window.bukaModalEdit = function (id, kode, nama, sks, semester) {
        document.getElementById("editIdMK").value = id;
        document.getElementById("editKode").value = kode;
        document.getElementById("editNama").value = nama;
        document.getElementById("editSKS").value = sks;
        document.getElementById("editSemester").value = semester;
        new bootstrap.Modal(document.getElementById("modalEditMK")).show();
      };

      document.getElementById("formEditMK").addEventListener("submit", function (e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append("id_mk", document.getElementById("editIdMK").value);
        formData.append("kode_mk", document.getElementById("editKode").value);
        formData.append("nama_mk", document.getElementById("editNama").value);
        formData.append("sks", document.getElementById("editSKS").value);
        formData.append("semester", document.getElementById("editSemester").value);

        fetch("api/update_matakuliah.php", { method: "POST", body: formData })
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success") {
                alert(res.message);
                bootstrap.Modal.getInstance(document.getElementById("modalEditMK")).hide();
                loadDataMatkul();
            } else {
                alert("Gagal: " + res.message);
            }
          })
          .catch((err) => alert("Terjadi kesalahan sistem saat memperbarui data!"));
      });
      
      // Fitur hapusMatkul sudah dihapus sepenuhnya dari sini
    </script>
  </body>
</html>
